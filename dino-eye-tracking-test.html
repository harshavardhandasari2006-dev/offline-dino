<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Dino — Interactive Eye Tracking Prototype</title>
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg?v=5">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 70%, #020617 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      user-select: none;
      overflow-x: hidden;
    }

    /* Header & Instructions */
    .test-header {
      text-align: center;
      margin-bottom: 24px;
      max-width: 680px;
    }

    .test-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #38bdf8;
      text-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
      margin-bottom: 8px;
    }

    .test-instruction {
      font-size: 16px;
      color: #94a3b8;
      line-height: 1.5;
    }

    .instruction-highlight {
      color: #4ade80;
      font-weight: 600;
    }

    /* Main Stage Card */
    .stage-card {
      background: rgba(19, 27, 46, 0.85);
      border: 1.5px solid rgba(56, 189, 248, 0.25);
      border-radius: 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      padding: 32px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      width: 100%;
      max-width: 640px;
      backdrop-filter: blur(12px);
    }

    /* Interactive Dino Stage Container */
    .dino-container {
      position: relative;
      width: 100%;
      max-width: 512px;
      aspect-ratio: 1024 / 906;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.4));
    }

    .dino-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: hidden;
    }

    /* Telemetry / Metrics Bar */
    .telemetry-bar {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }

    .telemetry-item {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: center;
    }

    .tel-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 4px;
    }

    .tel-val {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #4ade80;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
      animation: pulseDot 2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    /* Responsive adjustments */
    @media (max-width: 540px) {
      .telemetry-bar {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .test-title {
        font-size: 22px;
      }
      .stage-card {
        padding: 20px 16px 16px;
      }
    }
  </style>
</head>

    <!-- Live Telemetry Display -->

      <div class="telemetry-item">
        <div class="tel-label">Eye Gaze Status</div>

      </div>
      <div class="telemetry-item">
        <div class="tel-label">Left Eye Offset</div>
        <div id="leftOffsetVal" class="tel-val">+0.0px, +0.0px</div>
      </div>
      <div class="telemetry-item">
        <div class="tel-label">Right Eye Offset</div>
        <div id="rightOffsetVal" class="tel-val">+0.0px, +0.0px</div>
      </div>
    </div>
  </main>

  <script>
    (function() {
      'use strict';

      const svg = document.getElementById('eyeTrackingSvg');
      const leftPupilGroup = document.getElementById('leftPupilGroup');
      const rightPupilGroup = document.getElementById('rightPupilGroup');
      const leftOffsetVal = document.getElementById('leftOffsetVal');
      const rightOffsetVal = document.getElementById('rightOffsetVal');

      // Resting anatomical eye centers in SVG coordinate space (1024 x 906)
      const LEFT_EYE_CENTER = { x: 451, y: 233 };
      const RIGHT_EYE_CENTER = { x: 634, y: 236 };

      // Bounded movement parameters (anatomically plausible range in SVG units)
      const MAX_OFFSET_X = 12.0; // Max horizontal travel
      const MAX_OFFSET_Y = 15.0; // Max vertical travel
      const LERP_SPEED = 0.12;   // Silky smooth interpolation speed

      // Tracking state
      let targetLeft = { x: 0, y: 0 };
      let targetRight = { x: 0, y: 0 };
      let currentLeft = { x: 0, y: 0 };
      let currentRight = { x: 0, y: 0 };
      let isMouseInWindow = false;

      // Transform client screen coordinates to SVG viewBox space
      function screenToSvg(clientX, clientY) {
        const pt = svg.createSVGPoint();
        pt.x = clientX;
        pt.y = clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      function updateTargetOffsets(svgX, svgY) {
        // Calculate independent gaze vectors from each eye's local center
        const dxLeft = svgX - LEFT_EYE_CENTER.x;
        const dyLeft = svgY - LEFT_EYE_CENTER.y;
        const distLeft = Math.hypot(dxLeft, dyLeft);
        const angleLeft = Math.atan2(dyLeft, dxLeft);

        const dxRight = svgX - RIGHT_EYE_CENTER.x;
        const dyRight = svgY - RIGHT_EYE_CENTER.y;
        const distRight = Math.hypot(dxRight, dyRight);
        const angleRight = Math.atan2(dyRight, dxRight);

        // Smooth non-linear distance response curve (tanh prevents over-travel and sudden snap)
        const intensityLeft = Math.tanh(distLeft / 360);
        const intensityRight = Math.tanh(distRight / 360);

        targetLeft.x = Math.cos(angleLeft) * MAX_OFFSET_X * intensityLeft;
        targetLeft.y = Math.sin(angleLeft) * MAX_OFFSET_Y * intensityLeft;

        targetRight.x = Math.cos(angleRight) * MAX_OFFSET_X * intensityRight;
        targetRight.y = Math.sin(angleRight) * MAX_OFFSET_Y * intensityRight;
      }

      // Pointer event listeners
      window.addEventListener('pointermove', (e) => {
        isMouseInWindow = true;
        const svgCoords = screenToSvg(e.clientX, e.clientY);
        updateTargetOffsets(svgCoords.x, svgCoords.y);
      }, { passive: true });

      // When cursor leaves the test window, smoothly return to resting position
      document.addEventListener('mouseleave', () => {
        isMouseInWindow = false;
        targetLeft = { x: 0, y: 0 };
        targetRight = { x: 0, y: 0 };
      });

      // Animation loop for silky 60fps tracking
      function animate() {
        // Spring/lerp toward target offsets
        currentLeft.x += (targetLeft.x - currentLeft.x) * LERP_SPEED;
        currentLeft.y += (targetLeft.y - currentLeft.y) * LERP_SPEED;
        currentRight.x += (targetRight.x - currentRight.x) * LERP_SPEED;
        currentRight.y += (targetRight.y - currentRight.y) * LERP_SPEED;

        // Apply translations via SVG transform
        leftPupilGroup.setAttribute('transform', 'translate(' + currentLeft.x.toFixed(2) + ', ' + currentLeft.y.toFixed(2) + ')');
        rightPupilGroup.setAttribute('transform', 'translate(' + currentRight.x.toFixed(2) + ', ' + currentRight.y.toFixed(2) + ')');

        // Update telemetry display
        if (leftOffsetVal && rightOffsetVal) {
          const lSignX = currentLeft.x >= 0 ? '+' : '';
          const lSignY = currentLeft.y >= 0 ? '+' : '';
          leftOffsetVal.textContent = lSignX + currentLeft.x.toFixed(1) + 'px, ' + lSignY + currentLeft.y.toFixed(1) + 'px';

          const rSignX = currentRight.x >= 0 ? '+' : '';
          const rSignY = currentRight.y >= 0 ? '+' : '';
          rightOffsetVal.textContent = rSignX + currentRight.x.toFixed(1) + 'px, ' + rSignY + currentRight.y.toFixed(1) + 'px';
        }

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    })();
  </script>
