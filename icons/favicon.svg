<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4da6ff"/>
      <stop offset="100%" stop-color="#8cd0ff"/>
    </linearGradient>
    <linearGradient id="dinoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#68d646"/>
      <stop offset="100%" stop-color="#46af2c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with warm border -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#skyGrad)" stroke="#1e40af" stroke-width="4"/>

  <!-- Desert canyon mesa in background -->
  <path d="M 12 92 L 28 66 L 56 66 L 68 92 Z" fill="#e58e65" opacity="0.8"/>
  <rect x="28" y="65" width="28" height="2" fill="#f8ad86"/>

  <!-- Desert sand ground -->
  <path d="M 4 96 Q 64 92 124 96 L 124 124 L 4 124 Z" fill="#f59e0b"/>
  <path d="M 4 96 Q 64 92 124 96" stroke="#d97706" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Style 1 Friendly Classic Dino Mascot -->
  <g filter="url(#shadow)">
    <!-- Dorsal plates -->
    <path d="M 34 50 L 30 42 L 38 46 Z" fill="#1e5b15"/>
    <path d="M 42 38 L 38 28 L 48 34 Z" fill="#1e5b15"/>
    <path d="M 52 28 L 50 18 L 60 26 Z" fill="#1e5b15"/>

    <!-- Head and Body -->
    <path d="M 38 78 C 30 74 24 60 30 46 C 34 36 44 26 62 24 C 84 22 96 28 98 42 C 100 52 92 56 86 56 C 88 64 80 66 72 66 C 72 74 68 84 56 88 C 48 90 42 86 38 78 Z" fill="url(#dinoGrad)" stroke="#164811" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Buttery cream underbelly and lower jaw -->
    <path d="M 46 56 C 40 66 42 78 52 82 C 58 84 64 78 66 70 C 66 62 56 54 46 56 Z" fill="#fef08a"/>
    <path d="M 72 54 C 80 54 86 50 86 46 L 76 46 Z" fill="#fef08a"/>

    <!-- Dark green spot on back -->
    <circle cx="48" cy="46" r="3.5" fill="#2a731b"/>
    <circle cx="42" cy="56" r="2.8" fill="#2a731b"/>

    <!-- Snout & Mouth with Pink Tongue -->
    <path d="M 96 46 Q 84 52 74 48" stroke="#164811" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 88 47 Q 84 52 80 48" fill="#f43f5e"/>
    
    <!-- Nostril -->
    <ellipse cx="92" cy="36" rx="2" ry="1.5" fill="#164811"/>

    <!-- Big Friendly Eye with Eyebrow -->
    <ellipse cx="70" cy="36" rx="9.5" ry="10.5" fill="#ffffff" stroke="#164811" stroke-width="2.5"/>
    <ellipse cx="72" cy="36" rx="5.5" ry="6" fill="#0f172a"/>
    <circle cx="74" cy="33" r="2.2" fill="#ffffff"/>
    <circle cx="70" cy="38" r="0.9" fill="#ffffff"/>
    <!-- Eyebrow curve -->
    <path d="M 64 26 Q 71 22 78 26" stroke="#164811" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Short Arm with Claw -->
    <path d="M 68 60 C 74 60 78 64 76 68 C 74 70 70 68 66 66 Z" fill="#46af2c" stroke="#164811" stroke-width="2.5"/>
    <circle cx="77" cy="68" r="1.5" fill="#ffffff"/>
  </g>
</svg>
